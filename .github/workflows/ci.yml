# CI (WO-028, WO-130): mirrors `scripts/ci-local.sh` on a clean hosted Linux runner (master plan episodes 053/054,
# SL-OPS-001 in docs/ops/ci.md). The job runs the same default path as a local `just ci-local`: doctor, fmt-check,
# gov-check, then the workflows ci-clang, ci-gcc and ci-asan. `just ci-yaml-check` (tools/ci/check_workflows.py)
# guards this file.
#
# Toolchain (WO-130): the job runs in a digest-pinned Arch Linux container, pacman is pointed at one Arch Linux Archive
# snapshot, and the installed package versions must equal toolchain/ci-linux.json, so CI uses the primary toolchain
# (clang 23, gcc 16 and its libstdc++; toolchain/environments.json). The image digest and ARCHIVE_DATE below must equal
# toolchain/ci-linux.json (ci-yaml-check R-CI-TOOLCHAIN). To bump them: docs/ops/ci.md, "Bumping the snapshot".
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: ghcr.io/archlinux/archlinux:base-devel@sha256:34c489c3172d107273f6e286a9670f66a1fe643710d38bf96736fc32f6f5501f
    env:
      ARCHIVE_DATE: "2026/10/23"
      CCACHE_MAXSIZE: 1G
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Pin the Arch Linux Archive snapshot and bootstrap
        run: |
          set -euo pipefail
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCHIVE_DATE" > /etc/pacman.d/mirrorlist
          pacman --disable-sandbox --noconfirm -Syyuu
          pacman --disable-sandbox --noconfirm --needed -S git python zstd

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2 (tag commit resolved via api.github.com, 2026-10-17)
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (toolchain/ci-linux.json)
        run: |
          set -euo pipefail
          python3 -I tools/ci/check_toolchain.py packages toolchain/ci-linux.json > "$RUNNER_TEMP/packages.txt"
          xargs -a "$RUNNER_TEMP/packages.txt" pacman --disable-sandbox --noconfirm --needed -S

      - name: Verify the pinned versions
        run: |
          set -euo pipefail
          pacman -Q > "$RUNNER_TEMP/pacman-q.txt"
          python3 -I tools/ci/check_toolchain.py verify toolchain/ci-linux.json "$RUNNER_TEMP/pacman-q.txt"

      - name: Tool versions
        run: |
          bash scripts/doctor || true
          cmake --version
          clang --version
          g++ --version
          just --version

      - name: ccache directory
        run: echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0 (tag commit resolved via api.github.com, 2026-10-17)
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('toolchain/ci-linux.json') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('toolchain/ci-linux.json') }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-${{ hashFiles('toolchain/ci-linux.json') }}-

      - name: shellcheck
        run: shellcheck scripts/ci-local.sh scripts/doctor

      - name: ci-local (doctor, fmt-check, gov-check, workflows ci-clang ci-gcc ci-asan)
        run: bash scripts/ci-local.sh

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "### ci-local failed"
            echo
            log="$(ls -t build/ci-local/*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$log" ]; then
              echo "Last step log: \`$log\` (tail below; all logs are in the ci-logs artifact)"
              echo '```'
              tail -n 60 "$log"
              echo '```'
            else
              echo "No ci-local step log was written (the failure happened before or outside ci-local)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0 (tag commit resolved via api.github.com, 2026-10-17)
        with:
          name: acceptance
          path: build/acceptance
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0 (tag commit resolved via api.github.com, 2026-10-17)
        with:
          name: test-report
          path: build/debug/test-report.xml
          if-no-files-found: ignore

      - name: Upload ci-local logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0 (tag commit resolved via api.github.com, 2026-10-17)
        with:
          name: ci-logs
          path: |
            build/ci-local/*.log
            build/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
